name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  unit-test:
    name: unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/*.lock

      # -e . installs the builder entry point
      - name: Install dependencies
        run: pip install -e . -r requirements/requirements-dev.lock

      # Without docker. This cmd only writes .env and the secret files,
      # which are required, since the API resolves its settings while being imported
      - name: Create the environment files
        run: builder local files

      - name: Run unit tests
        run: pytest tests/unit

  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/*.lock

      - name: Install dependencies
        run: pip install -r requirements/requirements-dev.lock

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  types:
    name: types
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/*.lock

      - name: Install dependencies
        run: pip install -e . -r requirements/requirements-dev.lock

      - name: Check types
        run: mypy
