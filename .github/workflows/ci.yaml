name: CI

on:
  push:
    branches:
      - main
      - dev
      - tests
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  unit-test:
    name: unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/*.lock

      # -e . installs the builder entry point
      - name: Install dependencies
        run: pip install -e . -r requirements/requirements-dev.lock

      # Without docker. This cmd only writes .env and the secret files,
      # which are required, since the API resolves its settings while being imported
      - name: Create the environment files
        run: builder local files

      - name: Run unit tests
        run: pytest tests/unit

  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/*.lock

      - name: Install dependencies
        run: pip install -r requirements/requirements-dev.lock

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  types:
    name: types
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/*.lock

      - name: Install dependencies
        run: pip install -e . -r requirements/requirements-dev.lock

      - name: Check types
        run: mypy

  e2e:
    name: e2e success paths
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # The builder is standard library only, so no additional requirements.
      - name: Install the builder
        run: pip install -e .

      # Local collection run only. No Postman authentication is required.
      - name: Install the Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      # Returns once every healthcheck passes, so the collection runs on API that already answers.
      # --seed admin loads a single known admin and nothing else, so the collection
      # can use the admin only paths too.
      - name: Start the stack
        run: builder container up --seed admin

      # --bail stops on the first failure, since the tests are chained together
      # and each one depends on the previous.
      - name: Run the collection
        run: |
          postman collection run tests/postman/collections/e2e_success_paths \
            -e tests/postman/environments/e2e_success_paths.environment.yaml \
            --bail
