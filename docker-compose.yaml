name: event-booking

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_DB: ${POSTGRES_DB}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      <<: *db-env
      POSTGRES_PASSWORD_FILE: /var/lib/event-booking/secrets/postgres_password
      TZ: UTC
    volumes:
      - event-booking-db:/var/lib/postgresql
      - /var/lib/event-booking/secrets:/var/lib/event-booking/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *db-env
      POSTGRES_HOST: ${POSTGRES_HOST}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      TZ: UTC
    volumes:
      - /var/lib/event-booking/secrets:/var/lib/event-booking/secrets:ro
      - /var/log/event-booking:/var/log/event-booking
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  event-booking-db:
