$kind: http-request
description: |- 
  Try login on an existing account with the wrong password. 
  Response never confirms whether an account actually exists.
url: "{{baseUrl}}/auth/token"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
  Accept: application/json
body:
  type: urlencoded
  content:
    username: "{{user_username}}"
    password: "{{wrong_password}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Wrong credentials are refused", () => {
          pm.expect(pm.response.code).to.eql(401);

          const body = pm.response.json();
          pm.expect(body.status).to.eql("fail");
          pm.expect(body.code).to.eql("INVALID_CREDENTIALS");
      });

      pm.test("The auth header is returned", () => {
          pm.expect(pm.response.headers.get("WWW-Authenticate")).to.eql("Bearer");
      });
settings: {}
order: 3000
