$kind: http-request
description: "A weak password that breaks the strength rules."
url: "{{baseUrl}}/users"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "email": "password_validation@example.com",
      "username": "password_validation",
      "first_name": "password_validation",
      "last_name": "password_validation",
      "password": "{{weak_password}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("A weak password is rejected with the field listed in data", () => {
          pm.expect(pm.response.code).to.eql(422);

          const body = pm.response.json();
          pm.expect(body.status).to.eql("fail");
          pm.expect(body.code).to.eql("VALIDATION_ERROR");
          pm.expect(body.data).to.be.an("array").and.not.empty;
          pm.expect(body.data[0].loc).to.include("password");
      });
settings: {}
order: 1000
