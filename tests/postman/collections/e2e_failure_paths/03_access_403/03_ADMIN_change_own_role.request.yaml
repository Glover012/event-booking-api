$kind: http-request
description: "An admin may change anyone's role except their own."
url: "{{baseUrl}}/admin/users/{{admin_id}}/role"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
  Authorization: "Bearer {{admin_token}}"
body:
  type: json
  content: |-
    {
      "role": "user"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("An admin cannot change their own role", () => {
          pm.expect(pm.response.code).to.eql(403);
          pm.expect(pm.response.json().code).to.eql("CANNOT_MODIFY_OWN_PERMISSIONS");
      });
settings: {}
order: 3000
