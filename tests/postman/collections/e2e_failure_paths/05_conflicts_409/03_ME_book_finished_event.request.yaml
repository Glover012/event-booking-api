$kind: http-request
description: |-
  Other user tries to book finished event.
url: "{{baseUrl}}/events/{{finished_event_id}}/bookings"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
  Authorization: "Bearer {{other_user_token}}"
body:
  type: json
  content: |-
    {
      "ticket_amount": 1
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("A finished event refuses bookings", () => {
          pm.expect(pm.response.code).to.eql(409);
          pm.expect(pm.response.json().code).to.eql("EVENT_NOT_BOOKABLE");
      });
settings: {}
order: 3000
