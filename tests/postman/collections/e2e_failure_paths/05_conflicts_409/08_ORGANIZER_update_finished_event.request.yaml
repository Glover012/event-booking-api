$kind: http-request
description:
  Attempt to modify a fnished event. A finished events are frozen and cannot be editted.
url: "{{baseUrl}}/organizer/events/{{finished_event_id}}"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
  Authorization: "Bearer {{organizer_token}}"
body:
  type: json
  content: |-
    {
      "name": "finished event edit attempt",
      "location": "somewhere",
      "capacity": 10,
      "starts_at": "{{starts_at}}",
      "ends_at": "{{ends_at}}",
      "description": null
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const day = 24 * 60 * 60 * 1000;
      pm.variables.set("starts_at", new Date(Date.now() + 30 * day).toISOString());
      pm.variables.set("ends_at", new Date(Date.now() + 30 * day + 4 * 60 * 60 * 1000).toISOString());
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("A finished event cannot be edited", () => {
          pm.expect(pm.response.code).to.eql(409);
          pm.expect(pm.response.json().code).to.eql("EVENT_NOT_EDITABLE");
      });
settings: {}
order: 8000
