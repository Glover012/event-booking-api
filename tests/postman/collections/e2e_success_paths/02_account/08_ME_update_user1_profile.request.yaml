$kind: http-request
description: "Update user profile. Edit first and last name as only those are editiable."
url: "{{baseUrl}}/me"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
  Authorization: "Bearer {{user_token}}"
body:
  type: json
  content: |-
    {
      "first_name": "Updated fn",
      "last_name": "Updated ln"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Profile is updated and the response returns new values", () => {
          pm.expect(pm.response.code).to.eql(200);

          const body = pm.response.json();
          pm.expect(body.code).to.eql("ME_PROFILE_UPDATED");
          pm.expect(body.data.first_name).to.eql("Updated fn");
          pm.expect(body.data.last_name).to.eql("Updated ln");
      });
settings: {}
order: 8000
