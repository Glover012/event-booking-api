$kind: http-request
description: "Change user password. Step 10 confirms it by authorization."
url: "{{baseUrl}}/me/password"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
  Authorization: "Bearer {{user_token}}"
body:
  type: json
  content: |-
    {
      "old_password": "{{user_password}}",
      "new_password": "{{user_new_password}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Password is changed", () => {
          pm.expect(pm.response.code).to.eql(200);

          const body = pm.response.json();
          pm.expect(body.code).to.eql("PASSWORD_CHANGED_SUCCESSFULLY");
          pm.expect(body.data).to.be.null;
      });
settings: {}
order: 9000
