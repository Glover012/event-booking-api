$kind: http-request
description: |-
  Authorize standard user account after password change. 
  Then overwrites the user_token value in enviornment,
  so later steps use new token. It confirms that password 
  change step was succesfull.
url: "{{baseUrl}}/auth/token"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
  Accept: application/json
body:
  type: urlencoded
  content:
    username: "{{user_username}}"
    password: "{{user_new_password}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();

      pm.test("The new password is accepted", () => {
          pm.expect(pm.response.code).to.eql(200);
          pm.expect(body.token_type).to.eql("bearer");
          pm.expect(body.access_token).to.be.a("string").and.not.empty;
      });

      if (pm.response.code === 200) {
          pm.environment.set("user_token", body.access_token);
      }
settings: {}
order: 10000
