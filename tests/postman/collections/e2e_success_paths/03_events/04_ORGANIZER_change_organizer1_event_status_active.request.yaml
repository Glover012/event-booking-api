$kind: http-request
description: |- 
  Change status from draft to active. This is the only transition allowed on draft, and publishing in step 10 requires it.
url: "{{baseUrl}}/organizer/events/{{event_id}}/status"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
  Authorization: "Bearer {{organizer_token}}"
body:
  type: json
  content: |-
    {
      "status": "active"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Event becomes active", () => {
          pm.expect(pm.response.code).to.eql(200);

          const body = pm.response.json();
          pm.expect(body.code).to.eql("EVENT_STATUS_CHANGED");
          pm.expect(body.data.status).to.eql("active");
      });

      // Activating does not publish automatically. Step 10 sets public, 
      // and to be able to publish event must be active first.
      pm.test("Event is still not public", () => {
          pm.expect(pm.response.json().data.public).to.be.false;
      });
settings: {}
order: 4000
